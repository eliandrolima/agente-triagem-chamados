[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agente-triagem-chamados"
version = "0.1.0"
description = "Projeto avaliativo de triagem inteligente de chamados técnicos"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "langchain-core>=1.0",
    "langchain-google-genai>=3.0",
    "langchain-openai>=1.0",
    "langgraph>=1.0",
    "python-dotenv>=1.0",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27",
    "pytest>=8.0",
    "ruff>=0.9",
]

[tool.hatch.build.targets.wheel]
packages = ["src/triagem"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

